name: digest
# scope: prod-only — verdict-maturity anchor in the release chain
on:
  # daily digest is the verdict-maturity anchor (AI-DIAGNOSIS §4): pass verdicts
  # release only after appearing in a digest. Runs ahead of the 03:17 catalog
  # run so freshly matured verdicts release the same night. Moving this off the
  # maintainer's local launchd: the job is pure data aggregation (no LLM), so a
  # personal laptop being off must not freeze the whole release chain.
  schedule: [{ cron: '15 21 * * *' }]
  workflow_dispatch: {}
permissions: {}
jobs:
  digest:
    # scope guard: a fork's schedule would fail on the missing catalog branch
    # and then alert-spam the fork's tracker. Manual dispatch stays open.
    # Whitelist = the known data planes (org prod + terry2010 current prod).
    if: github.event_name != 'schedule' || contains(fromJSON('["awesome-market","terry2010"]'), github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency: catalog-branch        # same writer lock as catalog/verify/ingest (I-4)
    permissions: { contents: write }
    steps:
      # renders data that originated as untrusted npm metadata — same egress
      # posture as the verify plan job (git + npm registry only)
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: block
          allowed-endpoints: >
            registry.npmjs.org:443
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: render + push digest on catalog branch (re-render + retry on race)
        env:
          # self-adapting to repo renames — digest review links must never go stale
          MARKET_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          git config user.email "market-bot@users.noreply.github.com"
          git config user.name "market-bot"
          # tip only — the render only needs the head blobs (~14MB/index-commit
          # × all history was downloaded on EVERY retry before this); the forced
          # refspec keeps origin/catalog honest after a rewritten branch
          git fetch --depth=1 origin '+refs/heads/catalog:refs/remotes/origin/catalog' 2>/dev/null || echo "fetch failed — probing the remote to distinguish missing-branch from transient failure"
          # missing catalog branch = legitimately nothing to digest (fresh repo
          # bootstrap); a fetch failure with the branch present must fail loud —
          # a green skip would silently freeze pass verdicts for 24h. Local
          # rev-parse alone can't tell the two apart, so probe the remote.
          if ! git rev-parse --verify -q origin/catalog >/dev/null; then
            if ! git ls-remote origin >/dev/null 2>&1; then
              echo "origin unreachable — loud fail, not a silent skip"; exit 1
            fi
            if git ls-remote --exit-code --heads origin catalog >/dev/null 2>&1; then
              echo "catalog exists remotely but fetch failed — loud fail"; exit 1
            fi
            echo "no catalog branch — nothing to digest"
            exit 0
          fi
          # catalog branch is data-only — dedicated worktree, never the main
          # checkout; clear a stale one first (crashed runs can leave /tmp/cat)
          git worktree remove /tmp/cat --force 2>/dev/null || true
          # the other two wedge shapes (same fix as catalog-append/verify):
          # a stray NON-worktree dir and a missing-but-registered registration
          # both make `worktree add` fail on every attempt, not just retry 1
          rm -rf /tmp/cat
          git worktree prune
          # no "-b catalog" fallback: origin/catalog was verified above, so a
          # failed add means a real worktree problem — "-b" would branch off
          # MAIN's HEAD (no index.json there) and burn 4 dumb retries
          # --detach: pin the remote-tracking ref exactly — no DWIM surprise
          # (a 'catalog' local branch would still work, but detached matches
          # what the retry loop resets and pushes from, catalog-append.sh too)
          git worktree add /tmp/cat origin/catalog --detach || { echo "worktree add failed though origin/catalog exists"; exit 1; }
          ok=0
          for i in 1 2 3 4; do
            # EVERY phase retries — the loop exists so a raced push re-renders
            # against the newest remote; a tolerated fetch failure would render
            # against the stale ref and publish that instead
            git -C /tmp/cat fetch --depth=1 origin '+refs/heads/catalog:refs/remotes/origin/catalog' || { echo "fetch attempt $i failed"; sleep 3; continue; }
            git -C /tmp/cat reset --hard origin/catalog || { echo "reset attempt $i failed"; sleep 3; continue; }
            # reset leaves untracked files — a prior failed render's leftovers
            # would sneak into `git add digest/` below
            git -C /tmp/cat clean -fd digest/ 2>/dev/null || true
            # bound the append-only verdict log before rendering: drops only
            # superseded AI lines older than 180d (human lines + every key's
            # latest line are always kept — semantics-preserving, idempotent).
            # A failure must not block the digest: the log just stays bigger.
            npx tsx pipeline/verdicts-compact.ts /tmp/cat/ai-verdicts.jsonl \
              || echo "verdicts compact failed (non-fatal) — rendering on the un-compacted log"
            npx tsx pipeline/ai/digest.ts \
              --index /tmp/cat/index.json --verdicts /tmp/cat/ai-verdicts.jsonl \
              --state /tmp/cat/digest-state.json --out-dir /tmp/cat \
              || { echo "render attempt $i failed"; sleep 3; continue; }
            # add 也在重试环内:git add 对 ignored/损坏路径 exit 1 但仍会
            # 部分暂存——放行的话 diff --cached 看到残留暂存会提交"只有
            # state 没有日报 md"的半成品,成熟锚推进而公告面缺失(C-2 同类)
            git -C /tmp/cat add digest/ digest-state.json \
              || { echo "add attempt $i failed"; sleep 3; continue; }
            # ai-verdicts.jsonl may not exist on a fresh catalog branch —
            # compaction only rewrites it when present, so stage conditionally.
            # Non-fatal by design (a lost round self-heals next run) but never
            # silent — a failed stage means this round's compaction didn't land
            if [ -f /tmp/cat/ai-verdicts.jsonl ]; then
              git -C /tmp/cat add ai-verdicts.jsonl \
                || echo "::warning::verdicts stage failed — compaction lost this round"
            fi
            # staged-diff precheck: a REAL commit failure must not pass as
            # "nothing changed" — that's how a day's digest-state (the maturity
            # anchor) silently vanishes while the run stays green (C-2/V-S)
            if git -C /tmp/cat diff --cached --quiet; then
              echo "nothing changed vs origin"; ok=1; break
            fi
            git -C /tmp/cat commit -m "digest: $(date -u +%F) run ${GITHUB_RUN_ID}" \
              || { echo "commit attempt $i failed"; sleep 3; continue; }
            git -C /tmp/cat push origin HEAD:catalog && { ok=1; break; }
            echo "push rejected (attempt $i) — re-rendering against fresh remote"
            sleep 3
          done
          [ "$ok" = 1 ] || { echo "digest publish failed after retries"; exit 1; }

  # The AI-diagnose leg still runs on the maintainer's local launchd — it needs
  # the local LLM. This watchdog is the monitoring it lacks: pending review
  # targets plus a stale ai-verdicts.jsonl means the local job died silently
  # and submissions are rotting. Fires a pipeline-alert issue (deduped).
  watchdog:
    if: github.event_name != 'schedule' || contains(fromJSON('["awesome-market","terry2010"]'), github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # contents:read — this job checks out the repo AND fetches the catalog
    # branch (worktree + git log probes); issues:write alone leaves contents
    # at none, so it only works while the public repo's anonymous git read
    # happens to suffice (docket.yml grants the same pair explicitly)
    permissions: { issues: write, contents: read }
    steps:
      # outbound: github (fetch/checkout), api.github.com (gh), *.github.io
      # (health.json probe), npm (ci) — same posture as the digest job
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            registry.npmjs.org:443
            *.github.io:443
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: alert when diagnose is stale and review queue non-empty
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # staleness probes via the commits API, not `git log --grep`: the
          # probe's job is finding OLD commits, so any bounded fetch makes a
          # stale leg blind exactly when the outage is worst — and the
          # unbounded alternative was ~14MB/index-commit × all history on a
          # daily job. Page until a match, or until the oldest listed commit
          # already sits outside the window (anything deeper is older still →
          # that floor still fires the leg). Cap 5 pages.
          last_touch() {   # $1=path $2=commit-msg-prefix|"" → epoch|0|-1
            # -1 = probe failed (API outage/rate-limit): DISTINCT from 0
            # (paged to exhaustion, no match). Callers' `>0` staleness gates
            # skip both, but leg5's "never wired" check keys on `=0` exactly —
            # a verdicts-probe failure must not read as "worker never wired".
            local page=1 body first oldest
            while [ "$page" -le 5 ]; do
              body=$(gh api "repos/$GH_REPO/commits?sha=catalog&path=$1&per_page=100&page=$page" 2>/dev/null) \
                || { echo -1; return; }
              [ "$(printf '%s' "$body" | jq 'length // 0')" = "0" ] && break
              if [ -z "$2" ]; then
                first=$(printf '%s' "$body" | jq -r '.[0].commit.committer.date // empty')
              else
                first=$(printf '%s' "$body" | jq -r --arg p "$2" '[.[] | select(.commit.message | startswith($p))][0].commit.committer.date // empty')
              fi
              [ -n "$first" ] && { date -d "$first" +%s; return; }
              oldest=$(printf '%s' "$body" | jq -r '.[-1].commit.committer.date // empty')
              [ -z "$oldest" ] && break
              if [ $(( ($(date +%s) - $(date -d "$oldest" +%s 2>/dev/null || echo 0)) / 3600 )) -gt 48 ]; then
                date -d "$oldest" +%s; return   # floor — the real match is older
              fi
              page=$((page + 1))
            done
            echo 0
          }
          # freshness probe = last ai-diagnose LANDING, not last touch of the
          # file — human verdicts / verdicts-compact / submit-verdict jobs all
          # append the same file and would keep AGE_H green over a dead local
          # worker. Diagnose commits carry the fixed 'ai-diagnose:' prefix.
          LAST=$(last_touch ai-verdicts.jsonl 'ai-diagnose:')
          AGE_H=$(( ($(date +%s) - ${LAST:-0}) / 3600 ))
          # digest 的输入也要看:catalog publish 停摆 = digest 照样在旧数据上
          # "成功"渲染——光盯 verdicts 会漏掉上游停摆。探针必须按提交者区分:
          # 裸 `git log -- index.json` 会被 verify merge / 人工裁决 APPLY_INDEX
          # / re-features 的提交刷新——catalog 死了但 verify 活着时该腿永远
          # 新鲜。catalog publish 每班必提交("catalog: …",generatedAt=now 使
          # staged-diff 恒脏),按此前缀取最后一次发布提交才是真探针。
          LAST_IDX=$(last_touch index.json 'catalog:')
          IDX_AGE_H=$(( ($(date +%s) - ${LAST_IDX:-0}) / 3600 ))
          # 第三条腿:digest-state.json 陈旧 = digest job 绿过但没落盘
          # (含 false-green 吞掉的 commit 失败)——成熟锚静默冻结的最后兜底
          LAST_DS=$(last_touch digest-state.json '')
          DS_AGE_H=$(( ($(date +%s) - ${LAST_DS:-0}) / 3600 ))
          # catalog tip blobs via contents API raw media — no worktree, no
          # history. index.json is ~14MB so the base64 `content` field is
          # empty (the §5 /retest lesson): raw media is the only form that
          # works. A failed index fetch leaves the pending-gated legs blind —
          # skip just those and still evaluate the rest (an unreachable
          # catalog branch = bootstrap for the blob legs, not an outage).
          BLOBS_OK=1
          gh api "repos/$GH_REPO/contents/index.json?ref=catalog" -H 'Accept: application/vnd.github.raw' > /tmp/wd-index.json \
            || { echo "index.json fetch failed — pending-gated legs skipped this run"; BLOBS_OK=0; }
          gh api "repos/$GH_REPO/contents/ai-verdicts.jsonl?ref=catalog" -H 'Accept: application/vnd.github.raw' > /tmp/wd-verdicts.jsonl 2>/dev/null \
            || : > /tmp/wd-verdicts.jsonl
          # 第四条腿:线上 health.json 的 builtAt 超龄 = site.yml 部署停摆。
          # catalog/verify 的 dispatch 失败只 echo 记日志、下个 run 才补——
          # 没有这条腿,站点静默冻结(新裁决/刹车到不了公开面)无人发现。
          # builtAt 是本次改动新增字段;旧版 health.json 回落 generatedAt。
          # GITHUB_REPOSITORY 是 runner 内置变量——github.event.repository
          # 在 schedule 合成载荷上不可靠
          SITE_JSON=$(curl -fsSL --max-time 15 "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/health.json" 2>/dev/null || true)
          SITE_AGE_H=0
          if [ -n "$SITE_JSON" ]; then
            SITE_TS=$(echo "$SITE_JSON" | jq -r '.builtAt // .generatedAt // empty' 2>/dev/null || true)
            SITE_EPOCH=$(date -d "$SITE_TS" +%s 2>/dev/null || echo 0)
            if [ "${SITE_EPOCH:-0}" -gt 0 ]; then SITE_AGE_H=$(( ($(date +%s) - SITE_EPOCH) / 3600 )); fi
          fi
          # a probe crash must NOT read as "queue empty" — PENDING=''→0 would
          # silently blind the two pending-gated legs while the run stays
          # green. Blob-fetch failure already skipped these legs; a tsx crash
          # on fetched data is a real defect → loud fail → alert job fires.
          PENDING=0
          if [ "$BLOBS_OK" = 1 ]; then
            PENDING=$(npx tsx -e "
              import { CatalogIndex } from './src/schema.ts'
              import { loadVerdicts } from './pipeline/verdicts.ts'
              import { unreviewedTargets } from './pipeline/ai/diagnose.ts'
              import { readFileSync } from 'node:fs'
              const idx = CatalogIndex.parse(JSON.parse(readFileSync('/tmp/wd-index.json','utf8')))
              console.log(unreviewedTargets(idx, loadVerdicts('/tmp/wd-verdicts.jsonl')).length)
            ") || { echo "unreviewedTargets probe crashed — loud fail, not blind green"; exit 1; }
          fi
          # diagnose.paused = 本地 AI 队列是“声明暂停”而不是“疑似停摆”——
          # launchd 手动期/上线前的有意停机不该每班都报 pipeline-alert；
          # 其余三条腿（index/digest-state/site）与本地诊断无关，照常检查。
          PAUSED=0
          gh api "repos/$GH_REPO/contents/diagnose.paused?ref=catalog" -H 'Accept: application/vnd.github.raw' >/dev/null 2>&1 && PAUSED=1
          echo "last ai-diagnose commit age: ${AGE_H}h; last catalog publish age: ${IDX_AGE_H}h; digest-state age: ${DS_AGE_H}h; site health age: ${SITE_AGE_H}h; unreviewed targets: ${PENDING}; diagnose paused: ${PAUSED}"
          REASONS=""
          # leg fingerprint — REASONS embed changing counters (age grows every
          # day), so dedupe compares WHICH legs fired instead of the text:
          # same legs → the open issue already carries the alert, no daily
          # comment spam; a new/changed leg set still comments immediately.
          LEGS=""
          # LAST*=0 → the file has NO git history (never written). That is
          # bootstrap, not staleness — without the >0 guard a fresh deployment
          # false-alerts on every leg within its first day.
          # diagnose.paused on the catalog branch = declared stop, not a
          # dead worker — leg 1 skips a KNOWN pause (bin/ai-diagnose.sh
          # pause|resume flips it); the other legs still check normally
          if [ "$PAUSED" != 1 ] && [ "${PENDING:-0}" -gt 0 ] && [ "${LAST:-0}" -gt 0 ] && [ "${AGE_H:-9999}" -gt 48 ]; then
            REASONS="本地 ai-diagnose 疑似停摆：最近一次 ai-diagnose 提交已 ${AGE_H}h 且仍有 ${PENDING} 个目标未审——投稿将一直 pending。检查本机 launchd: \`launchctl list | grep opencode-market\`、日志与 ai.env。"
            LEGS="${LEGS}1"
          fi
          # LAST=0 with a live pipeline is NOT bootstrap — index has history so
          # catalog ran, yet no 'ai-diagnose:' commit ever landed: the local
          # worker was never wired up (or its commit prefix drifted). The >0
          # guard above keeps a truly fresh repo silent; this leg closes the
          # "never configured reads as bootstrap forever" blind spot.
          # separator on every append — multiple legs firing the same run used
          # to concatenate into one unreadable blob (maintainer sees a wall)
          if [ "$PAUSED" != 1 ] && [ "${PENDING:-0}" -gt 0 ] && [ "${LAST:-0}" = 0 ] && [ "${LAST_IDX:-0}" -gt 0 ]; then
            REASONS="${REASONS}${REASONS:+$'\n\n'}ai-verdicts.jsonl 中从未出现 ai-diagnose: 提交，但已有 ${PENDING} 个目标待审——本地诊断 worker 疑似从未接线（或提交前缀漂移），投稿将一直 pending。检查本机 launchd 配置。"
            LEGS="${LEGS}5"
          fi
          if [ "${LAST_IDX:-0}" -gt 0 ] && [ "${IDX_AGE_H:-0}" -gt 36 ]; then
            REASONS="${REASONS}${REASONS:+$'\n\n'}catalog 分支 ${IDX_AGE_H}h 无 catalog: 发布提交——catalog.yml 疑似停摆（generate/publish 连续失败或未跑），digest 正在陈旧数据上渲染。检查 Actions 里 catalog workflow 最近 run。"
            LEGS="${LEGS}2"
          fi
          if [ "${LAST_DS:-0}" -gt 0 ] && [ "${DS_AGE_H:-0}" -gt 36 ]; then
            REASONS="${REASONS}${REASONS:+$'\n\n'}digest-state.json ${DS_AGE_H}h 未更新——digest 成熟锚静默冻结，pass verdict 不放行。检查 Actions 里 digest workflow 最近 run。"
            LEGS="${LEGS}3"
          fi
          # 36h ≈ catalog 每天两次 dispatch 的 1.5 个周期——站点健康文件超龄
          # 说明 dispatch 连败或 site job 挂了;health.json 拉不到(404/网络)
          # 时 SITE_AGE_H=0 不误报(新站点/未启用 Pages 的仓库同样静默)。
          if [ "${SITE_AGE_H:-0}" -gt 36 ]; then
            REASONS="${REASONS}${REASONS:+$'\n\n'}线上 health.json ${SITE_AGE_H}h 未更新——site.yml 部署疑似停摆，catalog/verify 的新数据到不了公开站。检查 Actions 里 site workflow 最近 run；紧急可手动 dispatch（force/skip_skills 参数见 workflow）。"
            LEGS="${LEGS}4"
          fi
          # 第六腿:本机 worker 活着但通道降级——verdict commit 年龄看不见
          # "L0.5 挂了照样出判词"/"omlx 挂了走机械兜底"。diagnose-health.json
          # 由 ai-diagnose.sh 在状态翻转/24h 心跳时发布到 catalog 分支;
          # 只看新鲜戳(<48h),陈旧=worker 已死归第一腿管。声明暂停期跳过——
          # 与第一腿同一语义:有意停机不是降级。
          if [ "$PAUSED" != 1 ]; then
            H_JSON=$(gh api "repos/$GH_REPO/contents/diagnose-health.json?ref=catalog" -H 'Accept: application/vnd.github.raw' 2>/dev/null || true)
            if [ -n "$H_JSON" ]; then
              H_AT=$(printf '%s' "$H_JSON" | jq -r '.at // empty' 2>/dev/null || true)
              H_EPOCH=$(date -d "$H_AT" +%s 2>/dev/null || echo 0)
              H_AGE_H=$(( ($(date +%s) - ${H_EPOCH:-0}) / 3600 ))
              if [ "${H_EPOCH:-0}" -gt 0 ] && [ "${H_AGE_H:-0}" -lt 48 ]; then
                H_L05=$(printf '%s' "$H_JSON" | jq -r '.l05 // empty' 2>/dev/null || true)
                H_OMLX=$(printf '%s' "$H_JSON" | jq -r '.omlx // empty' 2>/dev/null || true)
                H_PUSHED=$(printf '%s' "$H_JSON" | jq -r '.pushed // empty' 2>/dev/null || true)
                H_BAD=""
                [ "$H_L05" = "failed" -o "$H_L05" = "untrusted" ] && H_BAD="${H_BAD}L0.5=${H_L05} "
                [ "$H_OMLX" = "down" -o "$H_OMLX" = "died-mid-run" ] && H_BAD="${H_BAD}omlx=${H_OMLX} "
                if [ -n "$H_BAD" ]; then
                  REASONS="${REASONS}${REASONS:+$'\n\n'}本机 ai-diagnose 降级运行（${H_BAD% }）——裁决仍在产出但注入筛查/LLM 评审通道受损。检查本机 L0.5 模型缓存（HF_HOME 外置卷）与 omlx 服务；详见 catalog 分支 diagnose-health.json。"
                  LEGS="${LEGS}6"
                fi
                # pushed=spooled 与通道降级不同义——判词写出来了但 catalog 推送
                # 重试全败、滞留本机 spool 等下轮重放。wrapper 每条终止路径都
                # stamp+publish，戳反映本轮结果（不再是滞后一个 run），单次
                # spooled 即当下真实故障；持续=remote/凭据坏。
                # 单列第七腿而非复用 6：LEGS 指纹按腿号去重，降级消退+spooled
                # 新发同为"6"会被判同腿静默吞掉新告警。
                if [ "$H_PUSHED" = "spooled" ]; then
                  REASONS="${REASONS}${REASONS:+$'\n\n'}本机 ai-diagnose 判词推送失败（pushed=spooled）——新判词滞留本机 pending-verdicts.jsonl 待下轮重放，catalog 暂时收不到。若持续出现检查本机 git remote/凭据与 catalog 分支状态；详见 diagnose-health.json。"
                  LEGS="${LEGS}7"
                fi
              fi
            fi
          fi
          if [ -n "$REASONS" ]; then
            # in:title 限定——正文中提到同样字样的无关 open issue 不能被当成
            # dedupe 目标而评论追加
            EXISTING=$(gh issue list -R "$GH_REPO" --label pipeline-alert --state open \
              --search "pipeline stale in:title" --json number --jq '.[0].number // empty' 2>/dev/null || true)
            if [ -n "$EXISTING" ]; then
              # daily spam guard: a persistent outage gets ONE comment per
              # legs-change; an unchanged leg set means the open issue still
              # carries a live alert — re-commenting trains the maintainer
              # to ignore it
              LAST_BODY=$(gh issue view "$EXISTING" -R "$GH_REPO" --json comments \
                --jq 'if (.comments | length) > 0 then .comments[-1].body else "" end' 2>/dev/null || true)
              if [ -z "$LAST_BODY" ]; then
                LAST_BODY=$(gh issue view "$EXISTING" -R "$GH_REPO" --json body --jq '.body' 2>/dev/null || true)
              fi
              LAST_LEGS=$(printf '%s' "$LAST_BODY" | grep -o 'watchdog-legs:[0-9]*' | tail -1 | cut -d: -f2 || true)
              if [ "$LAST_LEGS" = "$LEGS" ]; then
                echo "watchdog: same legs ($LEGS) already alerted on #$EXISTING — no repeat comment"
              else
                gh issue comment "$EXISTING" -R "$GH_REPO" --body "<!-- watchdog-legs:$LEGS -->"$'\n\n'"$REASONS"
                echo "watchdog: legs ${LAST_LEGS:-none}→$LEGS — commented on #$EXISTING"
              fi
            else
              gh label create pipeline-alert --color d93f0b --force 2>/dev/null || true
              gh issue create -R "$GH_REPO" --title "pipeline stale" \
                --body "<!-- watchdog-legs:$LEGS -->"$'\n\n'"$REASONS" --label pipeline-alert
              echo "watchdog: alert raised (new issue, legs=$LEGS)"
            fi
          else
            echo "watchdog: healthy"
          fi

  alert:
    needs: [digest, watchdog]
    # cancelled() included: digest shares the catalog-branch writer lock — an
    # eviction by a later writer loses the day's render + digest-state maturity
    # anchor with no signal (same shape verify.yml hardened in G-1)
    if: failure() || cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { issues: write }
    steps:
      # gh api only — same egress posture as the other jobs
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: block
          allowed-endpoints: api.github.com:443
      - name: open failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh label create pipeline-alert --color d93f0b --force 2>/dev/null || true
          # dedupe: a persistent failure (missing catalog branch, broken render)
          # must not open a fresh issue every day — append to the open one
          EXISTING=$(gh issue list --repo "$GH_REPO" --label pipeline-alert --state open --search "digest workflow failed in:title" --json number --jq '.[0].number // empty' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GH_REPO" --body "Failed again: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          else
            gh issue create \
              --title "digest workflow failed (run ${GITHUB_RUN_ID})" \
              --body "Automated alert: the digest workflow failed."$'\n\n'"Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              --label "pipeline-alert"
          fi
