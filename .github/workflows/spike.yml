name: spike-verify
on:
  push:
  workflow_dispatch:
permissions: {}
jobs:
  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      XDG_CONFIG_HOME: /tmp/spikehome/.config
      XDG_DATA_HOME: /tmp/spikehome/.local/share
      XDG_CACHE_HOME: /tmp/spikehome/.cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i -g @opencode/cli && opencode --version
      - run: mkdir -p "$XDG_CONFIG_HOME" && ls -la /tmp/spikehome
      # A2: add 正样本 → 配置应落在 XDG 隔离目录
      - run: opencode plugin add opencode-loop-recover 2>&1 | tee add.log
      - run: echo "=== config dir ===" && find /tmp/spikehome -type f && cat "$XDG_CONFIG_HOME/opencode/opencode.json" || true
      # A3: plugin list 是否显示已装插件（隔离语义验证）
      - run: opencode plugin list 2>&1 | tee list.log
      - run: |
          grep -q "loop-recover" list.log && echo "LIST-SHOWS-PLUGIN yes" || echo "LIST-SHOWS-PLUGIN no"
      # 负样本：假 npm 名应 fail
      - run: opencode plugin add nonexistent-pkg-zzz-404 2>&1 | tee bad.log; echo "exit=$?"
      - run: cat bad.log
      # A1/A3 核心：后台起 serve → curl API 端点拿插件可见性（比日志更客观的信号）
      - run: |
          opencode serve --hostname 127.0.0.1 --port 4099 --print-logs --log-level debug > server.log 2>&1 &
          sleep 5
          PW=$(grep "server password" server.log | awk '{print $NF}')
          echo "password=$PW"
          for ep in plugin config app project provider experimental; do
            echo "=== GET /$ep ==="
            curl -s -u "opencode:$PW" "http://127.0.0.1:4099/$ep" | head -c 2000; echo
          done
          echo "=== plugin log lines ==="
          grep -iE "plugin|loop.recover|loaded|init" server.log | head -30 || true
          kill %1 2>/dev/null || true
