name: catalog
on:
  schedule: [{ cron: '17 3 * * *' }]
  workflow_dispatch:
concurrency: catalog        # serialize — prevent two runs racing the catalog branch
permissions:
  contents: write           # catalog branch push
  pages: write              # Pages deployment
  id-token: write           # required by actions/deploy-pages
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: fetch old index (merge base)
        run: |
          git fetch origin catalog 2>/dev/null || true
          git show origin/catalog:index.json > /tmp/old-index.json 2>/dev/null || echo 'no old index'
      - name: run pipeline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx tsx pipeline/run.ts --out /tmp/index.json --old /tmp/old-index.json
      - name: commit index to catalog branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.email "market-bot@users.noreply.github.com"
          git config user.name "market-bot"
          git checkout -B catalog
          cp /tmp/index.json index.json
          git add index.json
          git commit -m "catalog: $(date -u +%F) run ${GITHUB_RUN_ID}" || echo "no changes"
          git push origin catalog
      - name: stage Pages site
        run: |
          mkdir -p /tmp/site
          cp /tmp/index.json /tmp/site/index.json
          printf '<!doctype html><title>opencode market</title><p>index at <a href="/index.json">/index.json</a></p>' > /tmp/site/index.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: /tmp/site }
      - uses: actions/deploy-pages@v4
        id: deploy
